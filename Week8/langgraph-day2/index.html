<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini AI Chat</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="connection-status" id="connectionStatus"></div>
            <h1>
                🤖 Gemini AI Chat
            </h1>
            <div class="status" id="statusText">Ready to chat</div>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="welcome-message">
                <span class="robot-emoji">🤖</span>
                <strong>Welcome to Gemini AI Chat!</strong><br>
                Start a conversation by typing a message below.
                <br><br>
                <small>Powered by Google's Gemini AI with conversation memory</small>
            </div>
        </div>

        <div class="typing-indicator" id="typingIndicator">
            <span>AI is thinking</span>
            <div class="typing-dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>

        <div class="chat-input">
            <div class="input-container">
                <textarea 
                    id="messageInput" 
                    class="input-field" 
                    placeholder="Type your message..." 
                    rows="1"
                ></textarea>
                <button id="sendButton" class="send-button" title="Send message">
                    ➤
                </button>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
